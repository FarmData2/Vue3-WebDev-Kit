name: New PR
description: 'Handles new pull requests.'

# Ensures that all new pull requests are marked as draft.
# Removes commit message from above Assignment if PR was created on branch with one commit.
# Adds a comment to all new pull requests with basic info.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  contents: write

jobs:
  make_draft_and_comment:
    name: Make draft and comment
    runs-on: ubuntu-latest
    steps:
      # Ensure the PR is a draft.
      - name: Convert PR to draft
        if: github.event.action == 'opened' && github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready --undo ${{ github.event.pull_request.html_url }}

      # Remove any text that appears above the Purpose heading.
      - name: Remove single commit info from PR body
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pr.data.body || '';
            const purposeHeaderRegex = /^###\s+Assignment\s*$/im;
            const match = purposeHeaderRegex.exec(body);

            if (match && match.index > 0) {
              const cleanedBody = body.slice(match.index);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: cleanedBody,
              });
              core.info('Removed text before Assignment heading.');
            }

      # Normalize checkboxes
      - name: Normalize checkboxes
        id: validate
        runs-on: ubuntu-latest
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            let body = pr.data.body || '';
            let bodyChanged = false;

            // Normalize checked boxes: [x ], [ x], [ x ] -> [x] (case insensitive)
            const malformedCheckedRegex = /\[\s*[xX]\s+\]|\[\s+[xX]\s*\]/g;
            if (malformedCheckedRegex.test(body)) {
              body = body.replace(malformedCheckedRegex, '[x]');

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: body,
              });
              core.info('Normalized checkboxes in PR body.');
            }

      # Add a comment with basic information to all new pull requests.
      - name: Add new PR comment
        if: github.event.action == 'opened'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Thank you for your pull request. 

            Note that all new pull requests to the Vue3-WebDev-Kit are opened as draft pull requests. 

            ### Submitting Your Work

            When you believe your work on the assignment is complete mark your pull request as ready for review to turn it in. 

            ### Getting Help

            If you have questions as you work you can get in touch via:
            - comments on this pull request.
            - comments on the associated issue(s).
            - any other course communication channel(s).
