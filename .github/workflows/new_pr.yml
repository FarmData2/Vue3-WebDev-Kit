name: New PR
description: 'Handles new pull requests.'

# Ensures that all new pull requests are marked as draft.
# Removes commit message from above Assignment if PR was created on branch with one commit.
# Validates that exactly one checkbox is selected in Type of Work and Topic.
# Adds a comment to all new pull requests with basic info.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  contents: write

jobs:
  make_draft_and_comment:
    name: Make draft and comment
    runs-on: ubuntu-latest
    steps:
      # Ensure the PR is a draft.
      - name: Convert PR to draft
        if: github.event.action == 'opened' && github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready --undo ${{ github.event.pull_request.html_url }}

      # Remove any text that appears above the Purpose heading.
      - name: Remove single commit info from PR body
        if: github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pr.data.body || '';
            const purposeHeaderRegex = /^###\s+Assignment\s*$/im;
            const match = purposeHeaderRegex.exec(body);

            if (match && match.index > 0) {
              const cleanedBody = body.slice(match.index);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: cleanedBody,
              });
              core.info('Removed text before Assignment heading.');
            }

      # Normalize checkboxes and validate checklist selections.
      - name: Normalize and validate checklist
        id: validate
        if: github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            let body = pr.data.body || '';
            let bodyChanged = false;

            // Fetch collaborator permissions for the PR author
            const { owner, repo } = context.repo;
            const username = context.payload.pull_request.user.login;
            const permResult = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            const permission = permResult.data.permission || 'none';
            const isMaintainer = ['write', 'maintain', 'admin'].includes(permission);

            // Normalize checked boxes: [x ], [ x], [ x ] -> [x] (case insensitive)
            const malformedCheckedRegex = /\[\s*[xX]\s+\]|\[\s+[xX]\s*\]/g;
            if (malformedCheckedRegex.test(body)) {
              body = body.replace(malformedCheckedRegex, '[x]');
              bodyChanged = true;
            }

            if (bodyChanged) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: body,
              });
              core.info('Normalized checkboxes in PR body.');
            }

            function getSection(text, headingTitle) {
              const escapedTitle = headingTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const headingRegex = new RegExp(`^###\\s+${escapedTitle}\\s*$`, 'im');
              const headingMatch = headingRegex.exec(text);
              if (!headingMatch) return '';

              const startIndex = headingMatch.index + headingMatch[0].length;
              const rest = text.slice(startIndex);
              const nextHeadingRegex = /^###\s+/m;
              const nextHeadingMatch = nextHeadingRegex.exec(rest);
              return nextHeadingMatch ? rest.slice(0, nextHeadingMatch.index) : rest;
            }

            function parseChecklist(sectionText) {
              const items = [];
              const checkboxRegex = /^\s*[-*]\s*\[(x|X| )\]\s*(?:-\s*)?(.*)$/gm;
              let match;
              while ((match = checkboxRegex.exec(sectionText)) !== null) {
                items.push({
                  checked: match[1].toLowerCase() === 'x',
                  label: (match[2] || '').trim(),
                });
              }
              return items;
            }

            const typeSection = getSection(body, 'Type of Work');
            const topicSection = getSection(body, 'Topic');
            const typeItems = parseChecklist(typeSection);
            const topicItems = parseChecklist(topicSection);

            const failures = [];
            if (typeItems.length === 0) {
              failures.push('The Type of Work checklist could not be found or parsed.');
            } else {
              const selectedType = typeItems.filter(i => i.checked);
              if (selectedType.length !== 1) {
                failures.push(`Exactly one checkbox must be selected in Type of Work (currently selected: ${selectedType.length}).`);
              }
            }

            if (topicItems.length === 0) {
              failures.push('The Topic checklist could not be found or parsed.');
            } else {
              const selectedTopic = topicItems.filter(i => i.checked);
              if (selectedTopic.length !== 1) {
                failures.push(`Exactly one checkbox must be selected in Topic (currently selected: ${selectedTopic.length}).`);
              }
            }

            // Determine if we should bypass the validation section for maintainers
            const isMissingChecklist = typeItems.length === 0 || topicItems.length === 0;
            const shouldBypass = isMaintainer && isMissingChecklist;

            let validationSection = '';
            if (failures.length > 0 && !shouldBypass) {
              validationSection = '### Checklist Validation Issues\n\n' + 
                                  failures.map(f => `- ${f}`).join('\n') + 
                                  '\n\nPlease address these issues before requesting a pull request review.\n';
            }

            core.setOutput('is-valid', String(failures.length === 0));
            core.setOutput('validation-section', validationSection);

      # Add a comment with basic information to all new pull requests.
      - name: Add new PR comment
        if: github.event.action == 'opened'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Thank you for your pull request. 

            Note that all new pull requests to the Vue3-WebDev-Kit are opened as draft pull requests. 

            ${{ steps.validate.outputs.validation-section }}

            ### Submitting Your Work

            When you believe your work on the assignment is complete mark your pull request as ready for review to turn it in. 

            ### Getting Help

            If you have questions as you work you can get in touch via:
            - comments on this pull request.
            - comments on the associated issue(s).
            - any other course communication channel(s).
